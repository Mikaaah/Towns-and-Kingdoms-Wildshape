plugins {
    id "com.gradleup.shadow"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }

    // mods the dev runs load like a mods folder would, unremapped: for mods made of nested jars, which the classpath
    // doesn't unpack. Fabric loader remaps them itself when the game starts.
    devModsFolder {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi("net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}") { exclude group: "net.fabricmc", module: "fabric-loader" }

    common(project(path: ":common", configuration: "namedElements")) { transitive = false }
    shadowBundle(project(path: ":common", configuration: "transformProductionFabric")) { transitive = false }

    // Performance mods, in the dev runs only: the ones PerformanceMods lists for Fabric on this version, pinned to
    // Modrinth version ids (the version numbers are shared between loaders). -Pwildshape.perfMods=false leaves them out, to
    // measure or debug Wildshape on its own. See docs/porting/performance-mods.md.
    if (project.findProperty("wildshape.perfMods") != "false") {
        // C2ME 0.4.0-alpha.0.29: its modules are nested jars. Not C2ME OpenCL: it needs Java 25, the dev game runs on 21.
        devModsFolder "maven.modrinth:c2me-fabric:RMHYO1LJ"
        modLocalRuntime "maven.modrinth:noisiumed:8mNj0Di8"     // Noisiumed 3.0.6
        modLocalRuntime "maven.modrinth:lithium:N08Z8wog"       // Lithium 0.15.4
        modLocalRuntime "maven.modrinth:modernfix:NnNX8LBn"     // ModernFix 5.25.1
        modLocalRuntime "maven.modrinth:sodium:SMxNOGZ6"        // Sodium 0.8.13
    }
    // Streams Reflowing 2.15.2, to see Wildshape's river currents in a dev run: -Pwildshape.streams=true
    if (project.findProperty("wildshape.streams") == "true") {
        modLocalRuntime "maven.modrinth:streams-reflowing:OBnu1pc1"
    }
    // other mods for a dev run, e.g. to try a compat: -Pwildshape.extraMod=<paths to their jars, or dependencies such as
    // maven.modrinth:alexs-caves-continued:T5wPX7t2, separated by commas>
    project.findProperty("wildshape.extraMod")?.split(",")?.each { mod ->
        modLocalRuntime(new File(mod).exists() ? files(mod) : mod)
    }
}

processResources {
    def props = [
        version: project.version,
        minecraft_version: rootProject.minecraft_version,
        fabric_loader_version: rootProject.fabric_loader_version,
        fabric_api_version: rootProject.fabric_api_version,
        fabric_api_min: rootProject.fabric_api_min
    ]
    inputs.properties props

    filesMatching("fabric.mod.json") {
        expand props
    }
}

shadowJar {
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
}

remapJar {
    injectAccessWidener = true
    inputFile.set shadowJar.archiveFile
    archiveClassifier = "fabric"
}

jar {
    archiveClassifier = "dev"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

// A client run that drives world creation and takes screenshots: ./gradlew :fabric:runClientTest
// Output (screenshots, log of what happened) goes to fabric/build/clienttest.
sourceSets {
    clienttest {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

def devModsDir = layout.buildDirectory.dir("devmods")
def syncDevMods = tasks.register("syncDevMods", Sync) {
    from configurations.devModsFolder
    into devModsDir
}
tasks.matching { it.name.startsWith("run") }.configureEach {
    dependsOn syncDevMods
}

loom {
    runs {
        configureEach {
            property "fabric.addMods", devModsDir.get().asFile.absolutePath
            // the dev game runs LWJGL 3.3.2, which Sodium refuses at startup; launchers ship 3.3.1, so only turn the
            // check off here
            property "sodium.checks.issue2561", "false"
        }
        // new worlds in the dev game start in creative with cheats, to fly around and inspect terrain
        client {
            property "wildshape.dev.creative", "true"
        }
        clientTest {
            client()
            name = "Client Test"
            source sourceSets.clienttest
            runDir = "run-clienttest"
            property "wildshape.clienttest.out", file("build/clienttest").absolutePath
            // -Dwildshape.clienttest.tour=true visits the landforms in a default world instead
            property "wildshape.clienttest.tour", System.getProperty("wildshape.clienttest.tour", "false")
            // -Dwildshape.clienttest.seed=<seed> makes the tour's world with that seed
            property "wildshape.clienttest.seed", System.getProperty("wildshape.clienttest.seed", "")
            property "wildshape.clienttest.stops", System.getProperty("wildshape.clienttest.stops", "river,salt_flat,alluvial_fan,glacial_valley,cirque,drumlins,moraine,barrier_island,karst,sinkhole,delta,wetland,lake,peninsula,coastal_island,sand_bar,skerry,volcanic_island,river_island,submarine_canyon,seamount,guyot,blue_hole,coral_reef,ocean_trench,ocean_ridge,sand_waves")
            property "wildshape.dev.creative", "true"
            // a flight recording of the run, e.g. to find who started a thread: -Dwildshape.jfr=<file>
            if (System.getProperty("wildshape.jfr") != null) {
                vmArg "-XX:StartFlightRecording=filename=" + System.getProperty("wildshape.jfr") + ",settings=profile"
            }
        }
    }
}

// Maven: <group>:wildshape-fabric:<version>, published to the repository given by -PmavenUrl (CI publishes to a folder
// and pushes it to the "maven" branch)
publishing {
    publications {
        register("maven", MavenPublication) {
            artifactId = "${rootProject.archives_base_name}-${project.name}"
            version = project.ext.mavenVersion
            artifact(remapJar) {
                builtBy remapJar
                classifier ""
            }
            artifact(sourcesJar) {
                builtBy sourcesJar
                classifier "sources"
            }
        }
    }
    repositories {
        if (project.hasProperty("mavenUrl")) {
            maven {
                url = project.mavenUrl
                if (!project.mavenUrl.toString().startsWith("file:")) {
                    credentials {
                        username = project.findProperty("mavenUsername") ?: "ci"
                        password = project.findProperty("mavenPassword") ?: "ci"
                    }
                }
            }
        }
    }
}
