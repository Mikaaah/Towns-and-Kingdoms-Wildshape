name: UTF NeoForge server runtime smoke test
on:
  push:
    paths:
      - '.github/workflows/audit-runtime-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure unattended UTF world
        run: |
          mkdir -p neoforge/run
          printf 'eula=true\n' > neoforge/run/eula.txt
          cat > neoforge/run/server.properties <<'PROPS'
          level-name=utf-smoke
          level-type=ultraterraforged:ultraterraforged
          level-seed=1357913579
          initial-enabled-packs=vanilla
          view-distance=3
          simulation-distance=3
          online-mode=false
          PROPS
      - name: Run headless NeoForge until initial generation
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 220s ./gradlew :neoforge:runServer -Putf.perfMods=false --no-daemon > server-smoke.log 2>&1
          code=$?
          set -e
          tail -n 160 server-smoke.log
          echo "Exit code: $code (124 means the running server reached timeout)"
          if grep -Eiq 'Done \([[:digit:].]+s\)!|Done \(' server-smoke.log neoforge/run/logs/latest.log 2>/dev/null; then
            echo "Server started and generated UTF overworld successfully."
          else
            echo "Server did not complete initial load; see logs."
            exit 1
          fi
          if grep -Eiq '(MixinApplyError|MixinTransformerError|NoClassDefFoundError|Could not load.*mixin)' server-smoke.log neoforge/run/logs/latest.log 2>/dev/null; then
            echo "Fatal mixin/classloading error detected."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: utf-neoforge-startup-smoke-logs
          path: |
            server-smoke.log
            neoforge/run/logs/
          if-no-files-found: warn
