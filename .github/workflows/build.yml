name: Build
on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

# a newer push to the same branch cancels the build still running for the older one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: checkout
        uses: actions/checkout@v4

      # Gradle, Loom and the mod run on Java 21
      - name: setup java
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/loom-cache
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: test
        run: >-
          ./gradlew :common:test -Pwildshape.perfMods=false
          --tests '*BiomeExclusionsTest' --tests '*CaveBiomeProtectionTest'
          --tests '*StructureSet*Test' --tests '*OptionalHabitatDatapackTest'
          --tests '*TaggedStructurePresetExportTest' --tests '*PresetDatapackTest'
          --tests '*StrataMaterialsTest' --tests '*FastPoissonContextTest'
          --tests '*SkerriesWaterTest' --tests '*WorldGenLookupTest'
          --tests '*TileCacheTest' --tests '*StructureRuleTest'
          --tests '*CacheTrimTest' --tests '*CaveFluidIntersectionTest'
          --tests '*StreamsCarvingGuardTest' --tests '*StreamsVersionTest'
          --tests '*NearGroundConditionTest' --tests '*CaveWaterSafetyTest'
          --tests '*RaisedWaterPlacementTest' --tests '*ModSurfaceRulesTest'
          --tests '*SkylandsDimensionResourcesTest'

      # the performance mods are only for the dev games; leaving them out keeps CI off their Maven servers
      - name: build
        run: ./gradlew :neoforge:build tnkReleaseCheck -Pwildshape.perfMods=false

      - name: upload jar
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: |
            neoforge/build/libs/

