name: Build
on: [ pull_request, push ]

# a newer push to the same branch cancels the build still running for the older one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # Gradle, Loom and the mod run on Java 21
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/loom-cache
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Check terrain and compatibility regressions
        run: >-
          ./gradlew :common:test -Pwildshape.perfMods=false
          --tests '*BiomeExclusionsTest' --tests '*CaveBiomeProtectionTest'
          --tests '*StructureSet*Test' --tests '*OptionalHabitatDatapackTest'
          --tests '*StrataMaterialsTest' --tests '*FastPoissonContextTest'
          --tests '*SkerriesWaterTest' --tests '*WorldGenLookupTest'
          --tests '*TileCacheTest' --tests '*StructureRuleTest'

      # the performance mods are only for the dev games; leaving them out keeps CI off their Maven servers
      - name: Build NeoForge
        run: ./gradlew :neoforge:build tnkReleaseCheck -Pwildshape.perfMods=false

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: |
            neoforge/build/libs/

