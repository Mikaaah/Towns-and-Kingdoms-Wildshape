name: curseforge push 1.1.0
run-name: curseforge push 1.1.0

on:
  push:
    branches: ['publish/curseforge-1.1.0']
    paths:
      - '.github/workflows/publish-verified-curseforge.yml'
      - 'release-assets/1.1.0/**'

permissions:
  actions: read
  contents: read

concurrency:
  group: curseforge-wildshape-1792816
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Get verified build
        uses: actions/download-artifact@v4
        with:
          name: Artifacts
          run-id: 44722297867
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/wildshape-build
      - name: Check JAR
        run: |
          jar=wildshape-1.1.0-neoforge-1.21.1.jar
          install -m 644 "$RUNNER_TEMP/wildshape-build/neoforge/build/libs/$jar" "release-assets/1.1.0/$jar"
          python3 gradle/release/tnk_versions.py verify --release release.json \
            --jar "release-assets/1.1.0/$jar" --target neoforge-1.21.1 \
            --expected-commit 7c136fc44a215e82c56c5f7fcc0bcc2a85d578b6
      - name: Upload to CurseForge
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: python3 release-assets/1.1.0/publish.py
      - name: Save receipt
        uses: actions/upload-artifact@v4
        with:
          name: wildshape-1.1.0-curseforge-receipt
          path: |
            release-assets/1.1.0/curseforge-upload-result.json
            release-assets/1.1.0/CHANGELOG.html
          if-no-files-found: error
