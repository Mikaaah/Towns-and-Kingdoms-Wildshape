name: Full Compatibility Static Inventory

on:
  workflow_dispatch:
  push:
    branches: ['audit/structure-compat-*']
    paths:
      - 'tools/audit-compat-jars.py'
      - 'tools/full-compat-inventory.py'
      - 'docs/audit/full-compat-1.0.5/dependency-lock.json'
      - '.github/workflows/full-compat-inventory.yml'

permissions:
  contents: read

jobs:
  static-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect pinned public dependency resources
        run: python tools/full-compat-inventory.py --download-dir "$RUNNER_TEMP/compat-jars" --output-dir build/full-compat-inventory --download
      - name: Save resource inventory (third-party JARs excluded)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wildshape-full-compat-static-inventory
          path: build/full-compat-inventory/
