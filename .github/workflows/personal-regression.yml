name: UTF Personal Regression Tests
on:
  push:
    branches: [fix/1.21.1-caverns-ui-stability, fix/1.21.1-performance-followup, work/20261020-cave-cache-final, main, neoforge-1.21.1, fabric-1.21.1]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run affected core tests
        run: |
          chmod +x gradlew
          ./gradlew :common:test --tests '*FailedTileRetryTest' --tests '*WaterContinuityTest' --tests '*LazyCallableTest' --tests '*SiteCacheTest' --tests '*MassiveCavernTest' --tests '*PresetOptionsTest' --tests '*CavesTest.giantCavernsHaveLakesAndPillars' -Putf.perfMods=false --no-daemon --stacktrace
      - name: Build distributable releases with exact dependency version
        env:
          RELEASE: 'true'
        run: ./gradlew :neoforge:build :fabric:build -Putf.perfMods=false --no-daemon --stacktrace
      - name: Verify NeoForge metadata and outputs
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          jars = list(Path('neoforge/build/libs').glob('*-neoforge.jar'))
          assert len(jars) == 1, jars
          with zipfile.ZipFile(jars[0]) as z:
              assert z.testzip() is None
              toml = z.read('META-INF/neoforge.mods.toml').decode()
              assert 'version="1.0.2+1.21.1"' in toml, toml
          print('Verified NeoForge version 1.0.2+1.21.1:', jars[0])
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ultraterraforged-personal-1.21.1-tested
          path: |
            neoforge/build/libs/*-neoforge.jar
            fabric/build/libs/*-fabric.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ultraterraforged-personal-junit-reports
          path: |
            common/build/test-results/test/
            common/build/reports/tests/test/
          if-no-files-found: warn
