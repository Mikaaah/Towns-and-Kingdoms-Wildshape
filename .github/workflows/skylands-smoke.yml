name: SkyLands existing-world compatibility
on:
  push:
    branches: ['compat/skylands-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skylands-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-server:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check the optional resource policy and existing terrain regressions
        run: >-
          ./gradlew :common:test -Pwildshape.perfMods=false --no-daemon
          --tests '*SkylandsDimensionResourcesTest' --tests '*PresetDatapackTest'
          --tests '*TaggedStructurePresetExportTest' --tests '*BiomeExclusionsTest'
          --tests '*CaveBiomeProtectionTest' --tests '*StreamsCarvingGuardTest'
          --tests '*StreamsVersionTest' --tests '*CacheTrimTest'
          --tests '*CaveFluidIntersectionTest' --tests '*ModSurfaceRulesTest'
          --tests '*MixinAnnotationsTest'
      - name: Build and verify the NeoForge release JAR
        run: ./gradlew :neoforge:build tnkReleaseCheck -Pwildshape.perfMods=false --no-daemon
      - name: Upgrade a saved 1.0.2 world, generate native islands and save/reload
        run: python3 tools/skylands-smoke.py --artifact neoforge/build/libs/wildshape-1.0.3-neoforge-1.21.1.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wildshape-skylands-verification
          path: |
            neoforge/build/libs/wildshape-1.0.3-neoforge-1.21.1.jar
            common/build/test-results/test/
            skylands-smoke/*.json
            skylands-smoke/*.log
            skylands-smoke/server/logs/
          if-no-files-found: warn
