name: Release
on:
  workflow_dispatch:
    inputs:
      version_type:
        description: Release channel on Modrinth and CurseForge
        type: choice
        default: alpha
        options: [release, beta, alpha]

# Configure the owned Wildshape project IDs before enabling marketplace publication.
env:
  MODRINTH_ID: "UNCONFIGURED"
  CURSEFORGE_ID: "UNCONFIGURED"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/loom-cache
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Get Mod Version
        id: mod_version
        run: grep "mod_version" gradle.properties | sed "s/\s//g" >> $GITHUB_OUTPUT

      - name: Get Platform Version
        id: minecraft_version
        run: grep "minecraft_version" gradle.properties | sed "s/\s//g" >> $GITHUB_OUTPUT

      - name: Get Composite Version
        id: composite_version
        run: echo "composite_version=${{ steps.mod_version.outputs.mod_version }}+${{ steps.minecraft_version.outputs.minecraft_version }}" >> $GITHUB_OUTPUT

      - name: Build NeoForge
        env:
          RELEASE: true
        run: ./gradlew :neoforge:build -Pwildshape.perfMods=false

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.composite_version.outputs.composite_version }}
          # the commit released; a new tag otherwise lands on the default branch, 1.20.1, whichever branch is released
          target_commitish: ${{ github.sha }}
          name: Wildshape ${{ steps.composite_version.outputs.composite_version }}
          body_path: CHANGELOG.md
          prerelease: ${{ inputs.version_type != 'release' }}
          files: |
            neoforge/build/libs/wildshape-${{ steps.composite_version.outputs.composite_version }}-neoforge.jar

      # mc-publish skips a platform whose token is empty, so the upload below
      # only run once MODRINTH_TOKEN / CURSEFORGE_TOKEN exist as repository secrets.
      - name: Publish NeoForge to Modrinth and CurseForge
        if: ${{ false }} # Fork release safety: configure own project IDs before enabling.
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          modrinth-id: ${{ env.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ env.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          name: Wildshape ${{ steps.composite_version.outputs.composite_version }} NeoForge
          version: ${{ steps.composite_version.outputs.composite_version }}-neoforge
          version-type: ${{ inputs.version_type }}
          changelog-file: CHANGELOG.md
          loaders: |
            neoforge
          game-versions: ${{ steps.minecraft_version.outputs.minecraft_version }}
          java: 21
          files: neoforge/build/libs/wildshape-${{ steps.composite_version.outputs.composite_version }}-neoforge.jar

  maven:
    needs: build
    uses: ./.github/workflows/publish-maven.yml
