name: Optional worldgen engine server verification
on:
  push:
    branches: ['audit/structure-compat-*']
  pull_request:
    branches: ['fix/worldgen-performance-1.0.4']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: optional-engine-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        engine: [ga1, ga2, byepregen, worldpreview]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the production NeoForge artifact
        run: ./gradlew :neoforge:build tnkReleaseCheck -Pwildshape.perfMods=false --no-daemon
      - name: Verify one optional engine with upgrade, generation, reload and absence
        run: >-
          python3 tools/skylands-smoke.py
          --artifact neoforge/build/libs/wildshape-1.0.5-beta.1-neoforge-1.21.1.jar
          --engine ${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optional-engine-${{ matrix.engine }}-server-evidence
          path: |
            skylands-smoke/*.json
            skylands-smoke/*.log
            skylands-smoke/server/logs/
            skylands-smoke/server/crash-reports/
          if-no-files-found: warn
