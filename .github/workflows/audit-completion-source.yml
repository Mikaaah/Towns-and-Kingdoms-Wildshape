name: Audit completion source snapshot
on:
  push:
    paths:
      - '.github/workflows/audit-completion-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package complete source at this commit
        run: |
          git archive --format=zip HEAD -o /tmp/wildshape-current-source.zip
          sha256sum /tmp/wildshape-current-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: wildshape-current-source
          path: /tmp/wildshape-current-source.zip
          if-no-files-found: error
