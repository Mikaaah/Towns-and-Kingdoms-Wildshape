name: Import pristine UltraTerraForged 1.21.1
on:
  push:
    paths:
      - '.github/workflows/import-upstream-1211.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch exact upstream 1.21.1 commit
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/Pandaismyname1/ultraterraforged.git
          git fetch --depth=1 upstream 0e85a9a3a04726d78b5835e3d73d76bd2de41215
          test "$(git rev-parse FETCH_HEAD)" = "0e85a9a3a04726d78b5835e3d73d76bd2de41215"
          echo "Verified upstream commit: $(git rev-parse FETCH_HEAD)"
          echo "Upstream files: $(git ls-tree -r --name-only FETCH_HEAD | wc -l)"
      - name: Import exact upstream source tree
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git read-tree --reset -u FETCH_HEAD
          upstream_tree="$(git rev-parse FETCH_HEAD^{tree})"
          imported_tree="$(git write-tree)"
          test "$upstream_tree" = "$imported_tree"
          echo "Verified original complete tree hash: $imported_tree"
          # GITHUB_TOKEN lacks 'workflows' permission for new workflow files.
          # Restore those four exact files separately via authorized GitHub connector.
          git rm -rf .github/workflows
          git commit -m "Import original UltraTerraForged 1.21.1 source (workflows restored separately)"
          git push origin HEAD:refs/heads/main
          echo "Imported complete 1.21.1 tree into main."
