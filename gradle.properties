org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# Mod
mod_id=wildshape
archives_base_name=wildshape
maven_group=nl.townsandkingdoms.wildshape

# Minecraft
minecraft_version=1.21.1
java_version=21

# Loaders
fabric_loader_version=0.19.5
fabric_api_version=0.116.17+1.21.1
# the oldest Fabric API the mod needs, for fabric.mod.json; the build compiles against the version above
fabric_api_min=0.102.0+1.21.1
neoforge_version=21.1.262

# Optional compat
terrablender_version=4.1.0.8

# TNK release identity is declared in release.json.
tnkTarget=neoforge-1.21.1
tnkArtifactProject=:neoforge
tnkArtifactTask=remapJar
