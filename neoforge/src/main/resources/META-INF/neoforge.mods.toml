[[mods]]
modId="ultraterraforged"
displayName="UltraTerraForged"
version="${version}"
authors="pandaismyname1 (original); Mikaaah (community fork)"
credits="A continuation of ReTerraForged by raccoonman, Steveplays28 and EdoEquin0x, itself a continuation of TerraForged by dags and Won-Ton"
